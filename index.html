<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Penerimaan Siswa Baru</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SheetJS untuk Export Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 1200px; }
        .form-section { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .table-section { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Aplikasi Penerimaan Siswa Baru</h1>
        
        <!-- Form Input Data Siswa -->
        <div class="form-section">
            <h3>Input Data Siswa Baru</h3>
            <form id="siswaForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nama" class="form-label">Nama Lengkap</label>
                        <input type="text" class="form-control" id="nama" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="umur" class="form-label">Umur</label>
                        <input type="number" class="form-control" id="umur" min="5" max="18" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="alamat" class="form-label">Alamat</label>
                        <input type="text" class="form-control" id="alamat" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="telepon" class="form-label">Nomor Telepon</label>
                        <input type="tel" class="form-control" id="telepon" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="tanggalDaftar" class="form-label">Tanggal Daftar</label>
                    <input type="date" class="form-control" id="tanggalDaftar" required>
                </div>
                <button type="submit" class="btn btn-primary">Tambah Siswa</button>
                <button type="button" class="btn btn-secondary ms-2" onclick="clearForm()">Bersihkan Form</button>
            </form>
        </div>

        <!-- Tabel Daftar Siswa -->
        <div class="table-section">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>Daftar Siswa Baru</h3>
                <button type="button" class="btn btn-success" onclick="exportToExcel()">Export ke Excel</button>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-hover" id="siswaTable">
                    <thead class="table-dark">
                        <tr>
                            <th>No</th>
                            <th>Nama</th>
                            <th>Umur</th>
                            <th>Alamat</th>
                            <th>Telepon</th>
                            <th>Tanggal Daftar</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="siswaBody">
                        <!-- Data akan ditambahkan oleh JavaScript -->
                    </tbody>
                </table>
            </div>
            <p id="totalSiswa" class="text-muted">Total Siswa: 0</p>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let siswaData = []; // Array untuk menyimpan data siswa
        let nextId = 1; // ID unik untuk setiap siswa

        // Event listener untuk form submit
        document.getElementById('siswaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Ambil data dari form
            const nama = document.getElementById('nama').value;
            const umur = document.getElementById('umur').value;
            const alamat = document.getElementById('alamat').value;
            const telepon = document.getElementById('telepon').value;
            const tanggalDaftar = document.getElementById('tanggalDaftar').value;

            // Buat objek siswa
            const siswa = {
                id: nextId++,
                nama: nama,
                umur: umur,
                alamat: alamat,
                telepon: telepon,
                tanggalDaftar: tanggalDaftar
            };

            // Tambahkan ke array
            siswaData.push(siswa);
            updateTable();
            clearForm();
            alert('Data siswa berhasil ditambahkan!');
        });

        // Fungsi update tabel
        function updateTable() {
            const tbody = document.getElementById('siswaBody');
            tbody.innerHTML = ''; // Kosongkan tabel

            siswaData.forEach((siswa, index) => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${siswa.id}</td>
                    <td>${siswa.nama}</td>
                    <td>${siswa.umur}</td>
                    <td>${siswa.alamat}</td>
                    <td>${siswa.telepon}</td>
                    <td>${siswa.tanggalDaftar}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deleteSiswa(${siswa.id})">Hapus</button>
                    </td>
                `;
            });

            // Update total siswa
            document.getElementById('totalSiswa').textContent = `Total Siswa: ${siswaData.length}`;
        }

        // Fungsi bersihkan form
        function clearForm() {
            document.getElementById('siswaForm').reset();
            document.getElementById('tanggalDaftar').valueAsDate = new Date(); // Set default hari ini
        }

        // Fungsi hapus siswa
        function deleteSiswa(id) {
            if (confirm('Yakin ingin menghapus siswa ini?')) {
                siswaData = siswaData.filter(s => s.id !== id);
                updateTable();
            }
        }

        // Fungsi export ke Excel menggunakan SheetJS
        function exportToExcel() {
            if (siswaData.length === 0) {
                alert('Tidak ada data untuk diexport!');
                return;
            }

            // Buat worksheet dari data
            const ws = XLSX.utils.json_to_sheet(siswaData);

            // Buat workbook
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Daftar Siswa');

            // Download file
            XLSX.writeFile(wb, 'daftar-siswa-baru.xlsx');
            alert('Data berhasil diexport ke Excel!');
        }

        // Set default tanggal hari ini saat load halaman
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('tanggalDaftar').valueAsDate = new Date();
        });
    </script>
</body>
</html>
